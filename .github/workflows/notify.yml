# サーバーなしでニュースを取得し、メールで通知する。
# 使い方は README の「PC を閉じていても通知を受け取る（GitHub Actions）」を参照。
name: ニュース通知

on:
  schedule:
    # 30 分ごと（混雑する毎時 0 分を避ける）。時刻は UTC 基準だが、配信時刻の判定は TIMEZONE で行う
    - cron: "7,37 * * * *"
  workflow_dispatch:

# 最小限の権限だけを与える（リポジトリの読み取りのみ）
permissions:
  contents: read

# 前の実行が終わる前に次が始まらないようにする（状態の取り合いを防ぐ）
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    # Variables に NOTIFY_ENABLED=true を設定するまでは動かない
    if: vars.NOTIFY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # 前回までの状態（どの記事を通知済みか）を復元する。
      # 状態には購読先や IR 銘柄が含まれるので、Secret の鍵で暗号化してキャッシュに置く
      - name: 前回の状態を復元
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: notify-state-${{ github.run_id }}
          restore-keys: notify-state-

      - name: 状態を復号
        env:
          STATE_KEY: ${{ secrets.STATE_KEY || secrets.SMTP_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p data
          if [ -f state.enc ]; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in state.enc | tar -xz -C data; then
              echo "::warning::前回の状態を復号できませんでした（鍵が変わった可能性）。新しく始めます"
              rm -rf data && mkdir -p data
            fi
          fi

      - name: 取得して通知
        run: python -m app.cli run
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/feedly.db
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NOTIFY_KEYWORDS: ${{ secrets.NOTIFY_KEYWORDS }}
          # 購読先を非公開にしたい場合は、OPML の中身をそのまま Secret に入れる
          FEEDS_OPML_XML: ${{ secrets.FEEDS_OPML_XML }}
          # IR 開示（EDINET）。どちらも Secret に入れ、ウォッチリストを公開しない
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          IR_WATCHLIST: ${{ secrets.IR_WATCHLIST }}
          LOG_FEED_DETAILS: ${{ vars.LOG_FEED_DETAILS || 'false' }}
          DIGEST_TIMES: ${{ vars.DIGEST_TIMES || '07:00,18:00' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Tokyo' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'http://localhost:8000' }}
          RETENTION_DAYS: "14"

      # 閲覧サイト（GitHub Pages）。記事は SITE_PASSWORD で暗号化してから公開する
      # メール送信に失敗しても、サイトは更新する
      - name: 閲覧サイトを作成
        if: ${{ !cancelled() && vars.SITE_ENABLED == 'true' }}
        run: python -m app.cli build-site --out _site
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/feedly.db
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_DAYS: ${{ vars.SITE_DAYS || '7' }}

      - name: 閲覧サイトをアップロード
        if: ${{ !cancelled() && vars.SITE_ENABLED == 'true' && hashFiles('_site/data.json') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 状態を暗号化
        if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY || secrets.SMTP_PASSWORD }}
        run: |
          set -o pipefail
          tar -cz -C data . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:STATE_KEY -out state.enc

      - name: 状態を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: notify-state-${{ github.run_id }}-${{ github.run_attempt }}

  # 公開の権限はこのジョブだけに与える
  deploy-site:
    needs: notify
    if: ${{ !cancelled() && needs.notify.result != 'skipped' && vars.SITE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

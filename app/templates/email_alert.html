<!doctype html>
<html lang="ja">
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;color:#1f2328;">
<div style="max-width:640px;margin:0 auto;padding:24px 16px;">
  <h1 style="font-size:20px;margin:0 0 16px;">キーワードに一致する新着記事</h1>
  <div style="background:#ffffff;border-radius:8px;padding:16px;">
    {% for a, matched in hits %}
    <div style="padding:8px 0;{% if not loop.first %}border-top:1px solid #eee;{% endif %}">
      <a href="{{ a.link }}" style="color:#1f2328;font-weight:bold;text-decoration:none;font-size:15px;">{{ a.title }}</a>
      <div style="color:#888;font-size:12px;margin-top:4px;">
        {{ a.feed.title }} · {{ a.published_at|localtime }} ·
        {% for w in matched %}<span style="background:#e6f4ea;color:#2b7a4b;padding:1px 6px;border-radius:4px;">{{ w }}</span> {% endfor %}
      </div>
      {% if a.summary %}<div style="color:#555;font-size:13px;margin-top:4px;">{{ a.summary }}</div>{% endif %}
    </div>
    {% endfor %}
  </div>
  <p style="text-align:center;font-size:13px;"><a href="{{ base_url }}/" style="color:#2b7a4b;">アプリで見る</a></p>
</div>
</body>
</html>
